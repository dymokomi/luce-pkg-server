name: Deployment bundle
# Builds only the immutable Linux bundle, in minutes. The exhaustive test matrix in
# registry.yml builds the same bundle at the end of a two-hour job; this one exists so
# a deploy does not wait for it. Both build from the same commit and the dependencies at main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-pkg-server
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git
          python3 luce-base/tools/checkout_main.py luce-pkg-server luce luce-luc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap registry dependencies without language changes
        working-directory: luce-pkg-server
        run: python3 tools/bootstrap_registry.py
      - name: Build immutable Linux deployment bundle
        working-directory: luce-pkg-server
        shell: bash
        run: |
          ./deploy/build-release.sh \
            "$PWD/build/toolchain/luce-base" \
            "$GITHUB_SHA" \
            "$PWD/build/luce-pkg-server-$GITHUB_SHA-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.sha }}-linux-x86_64
          path: luce-pkg-server/build/luce-pkg-server-${{ github.sha }}-linux-x86_64
          if-no-files-found: error
