name: Loopback registry accounts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The exhaustive generated-C/sanitizer and repository stress matrices take
    # more than 75 minutes on a cold two-core Linux runner without being stalled.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-pkg-server
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git
          python3 luce-base/tools/checkout_main.py luce-pkg-server luce luce-luc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap registry dependencies without language changes
        working-directory: luce-pkg-server
        run: python3 tools/bootstrap_registry.py
      - name: Registry accounts in all six modes
        working-directory: luce-pkg-server
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run_registry.py 2>&1 | tee build/accounts-ci.log
      - name: Registry native memory safety
        working-directory: luce-pkg-server
        shell: bash
        run: |
          set -o pipefail
          python3 tests/sanitize_registry.py --base build/toolchain/luce-base 2>&1 | tee build/sanitize-ci.log
      - name: Repository persistence, ownership and worker races
        working-directory: luce-pkg-server
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run_repositories.py 2>&1 | tee build/repositories-ci.log
          python3 tests/run_repositories.py --mode sanitize 2>&1 | tee build/repositories-sanitize-ci.log
          python3 tests/run_repositories.py --fixture refs 2>&1 | tee build/refs-ci.log
          python3 tests/run_repositories.py --fixture refs --mode sanitize 2>&1 | tee build/refs-sanitize-ci.log
          python3 tests/run_repositories.py --fixture graph 2>&1 | tee build/graph-ci.log
          python3 tests/run_repositories.py --fixture graph --mode sanitize 2>&1 | tee build/graph-sanitize-ci.log
          python3 tests/run_repositories.py --fixture receive 2>&1 | tee build/receive-ci.log
          python3 tests/run_repositories.py --fixture receive --mode sanitize 2>&1 | tee build/receive-sanitize-ci.log
          python3 tests/run_repositories.py --fixture large_objects 2>&1 | tee build/large-objects-ci.log
          python3 tests/run_repositories.py --fixture large_objects --mode sanitize 2>&1 | tee build/large-objects-sanitize-ci.log
      - name: Repository native heap cleanup
        if: runner.os == 'macOS'
        working-directory: luce-pkg-server
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run_repositories.py --mode native0 --heap 2>&1 | tee build/repositories-heap-ci.log
          python3 tests/run_repositories.py --fixture refs --mode native0 --heap 2>&1 | tee build/refs-heap-ci.log
          python3 tests/run_repositories.py --fixture graph --mode native0 --heap 2>&1 | tee build/graph-heap-ci.log
          python3 tests/run_repositories.py --fixture receive --mode native0 --heap 2>&1 | tee build/receive-heap-ci.log
          python3 tests/run_repositories.py --fixture large_objects --mode native0 --heap 2>&1 | tee build/large-objects-heap-ci.log
      - name: Heap-tool process lifecycle regression
        if: always()
        working-directory: luce-pkg-server
        run: python3 tests/test_heap_process.py
      - name: Build immutable Linux deployment bundle
        if: runner.os == 'Linux'
        working-directory: luce-pkg-server
        shell: bash
        run: |
          ./deploy/build-release.sh \
            "$PWD/build/toolchain/luce-base" \
            "$GITHUB_SHA" \
            "$PWD/build/luce-pkg-server-$GITHUB_SHA-linux-x86_64"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: luce-pkg-server-${{ github.sha }}-linux-x86_64
          path: luce-pkg-server/build/luce-pkg-server-${{ github.sha }}-linux-x86_64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-${{ matrix.os }}
          path: |
            luce-pkg-server/build/accounts-ci.log
            luce-pkg-server/build/sanitize-ci.log
            luce-pkg-server/build/native3/registry
            luce-pkg-server/build/native3/admin
            luce-pkg-server/build/repositories-ci.log
            luce-pkg-server/build/repositories-sanitize-ci.log
            luce-pkg-server/build/repositories-heap-ci.log
            luce-pkg-server/build/refs-ci.log
            luce-pkg-server/build/refs-sanitize-ci.log
            luce-pkg-server/build/refs-heap-ci.log
            luce-pkg-server/build/graph*.log
            luce-pkg-server/build/receive*.log
            luce-pkg-server/build/releases*.log
            luce-pkg-server/build/pull-requests*.log
            luce-pkg-server/build/large-objects-ci.log
            luce-pkg-server/build/large-objects-sanitize-ci.log
            luce-pkg-server/build/large-objects-heap-ci.log
