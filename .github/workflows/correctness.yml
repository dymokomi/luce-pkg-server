name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: static-and-compiler-profile, runner: ubuntu-24.04, kind: static}
          - {name: registry-native0, runner: ubuntu-24.04, kind: registry, mode: native0}
          - {name: registry-native1, runner: ubuntu-24.04, kind: registry, mode: native1}
          - {name: registry-native2, runner: ubuntu-24.04, kind: registry, mode: native2}
          - {name: registry-native3-linux, runner: ubuntu-24.04, kind: registry, mode: native3}
          - {name: registry-native3-macos, runner: macos-15, kind: registry, mode: native3}
          - {name: registry-c, runner: ubuntu-24.04, kind: registry, mode: c}
          - {name: registry-c-release, runner: ubuntu-24.04, kind: registry, mode: c-release}
          - {name: repositories, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: native3}
          - {name: refs, runner: ubuntu-24.04, kind: repository, fixture: refs, mode: native3}
          - {name: large-objects, runner: ubuntu-24.04, kind: repository, fixture: large_objects, mode: native3}
          - {name: graph, runner: ubuntu-24.04, kind: repository, fixture: graph, mode: native3}
          - {name: receive, runner: ubuntu-24.04, kind: repository, fixture: receive, mode: native3}
          - {name: repository-native0, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: native0}
          - {name: repository-native1, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: native1}
          - {name: repository-native2, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: native2}
          - {name: repository-c, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: c}
          - {name: repository-c-release, runner: ubuntu-24.04, kind: repository, fixture: repositories, mode: c-release}
          - {name: registry-sanitizers, runner: ubuntu-24.04, kind: sanitize-registry}
          - {name: repository-sanitizers, runner: ubuntu-24.04, kind: sanitize, fixture: repositories}
          - {name: refs-sanitizers, runner: ubuntu-24.04, kind: sanitize, fixture: refs}
          - {name: large-objects-sanitizers, runner: ubuntu-24.04, kind: sanitize, fixture: large_objects}
          - {name: graph-sanitizers, runner: ubuntu-24.04, kind: sanitize, fixture: graph}
          - {name: receive-sanitizers, runner: ubuntu-24.04, kind: sanitize, fixture: receive}
          - {name: refs-macos-heap, runner: macos-15, kind: heap, fixture: refs, mode: native0}
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-pkg-server
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-base, path: luce-base}
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-pkg-server luce luce-luc
      - name: Select Clang
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build the toolchain
        working-directory: luce-pkg-server
        run: python3 tools/bootstrap_registry.py
      - name: Static contracts
        if: matrix.kind == 'static'
        working-directory: luce-pkg-server
        run: |
          python3 tests/test_heap_process.py
      - name: Registry integration
        if: matrix.kind == 'registry'
        working-directory: luce-pkg-server
        run: python3 tests/run_registry.py --mode ${{ matrix.mode }}
      - name: Repository integration
        if: matrix.kind == 'repository'
        working-directory: luce-pkg-server
        run: python3 tests/run_repositories.py --fixture ${{ matrix.fixture }} --mode ${{ matrix.mode }}
      - name: Registry sanitizers
        if: matrix.kind == 'sanitize-registry'
        working-directory: luce-pkg-server
        run: python3 tests/sanitize_registry.py --base build/toolchain/luce-base
      - name: Repository sanitizers
        if: matrix.kind == 'sanitize'
        working-directory: luce-pkg-server
        run: python3 tests/run_repositories.py --fixture ${{ matrix.fixture }} --mode sanitize
      - name: macOS heap gate
        if: matrix.kind == 'heap'
        working-directory: luce-pkg-server
        run: python3 tests/run_repositories.py --fixture ${{ matrix.fixture }} --mode ${{ matrix.mode }} --heap

