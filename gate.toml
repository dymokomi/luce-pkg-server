# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE and LUCE
# naming the toolchain the gate built.
# The registry runs on Linux; macOS checks it natively with the heap tool; it has no Windows
# deployment, so Windows has no steps.
tools = ["luce", "luce-luc"]

[macos]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    # accounts in all six modes; repository persistence, ownership and worker races
    "python3 tests/run_registry.py",
    "for fixture in repositories refs graph receive large_objects; do python3 tests/run_repositories.py --fixture $fixture; done",
]
full = [
    # native memory safety and heap cleanup
    "python3 tests/test_heap_process.py",
    "python3 tests/sanitize_registry.py --base build/toolchain/luce-base",
    "for fixture in repositories refs graph receive large_objects; do python3 tests/run_repositories.py --fixture $fixture --mode native0 --heap; done",
]

[linux]
steps = [
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python3 tests/run_registry.py",
    "for fixture in repositories refs graph receive large_objects; do python3 tests/run_repositories.py --fixture $fixture; done",
    # the immutable Linux deployment bundle builds
    "./deploy/build-release.sh \"$PWD/build/toolchain/luce-base\" \"$(git rev-parse HEAD)\" \"$PWD/build/luce-pkg-server-$(git rev-parse HEAD)-linux-x86_64\"",
]
full = [
    "python3 tests/test_heap_process.py",
    "python3 tests/sanitize_registry.py --base build/toolchain/luce-base",
    "for fixture in repositories refs graph receive large_objects; do python3 tests/run_repositories.py --fixture $fixture --mode sanitize; done",
]

[windows]
steps = []
